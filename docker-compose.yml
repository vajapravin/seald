services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: seald-backend
    env_file:
      - backend/.env
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app  # Enables hot-reloading during development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    restart: unless-stopped
    networks:
      - app-net

  # frontend service will be added in the next step (React SPA)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: seald-frontend
    ports:
      - "3002:3002"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app  # Enables hot-reloading during development
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge