line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear (common bug patterns)
    "SIM", # simplify
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# B008: FastAPI's Depends() in argument defaults is idiomatic, not a bug
"backend/app/api/**" = ["B008"]
# E402: conftest sets env vars before importing app modules — order matters
"backend/tests/conftest.py" = ["E402"]